[project]
name = "geneset_translator"
version = "1.1.0"
description = "Explore biomedical knowledge graphs for your gene sets via NCATS Translator"
authors = [{ name = "Natalie Gill" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "tct>=0.1.6,<0.2.0",
    "streamlit>=1.50.0,<2.0.0",
    "pydantic>=2.11.9,<3.0.0",
    "networkx>=3.5,<4.0",
    "pandas>=2.2.1,<3.0.0",
    "python-louvain>=0.16,<0.17",
    "streamlit-cytoscape>=0.2.1",
    "scipy>=1.16.2,<2.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "treelib>=1.8.0,<2.0.0",
    "altair>=6.0.0,<7.0.0",
    # LLM summarization (optional at runtime)
    "anthropic>=0.105,<0.106",
    "python-dotenv>=1.0.0,<2.0.0",
    "requests>=2.32.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "jupyter>=1.1.1,<2.0.0",
    "ipykernel>=6.30.1,<7.0.0",
    "watchdog>=6.0.0,<7.0.0",
    "notebook>=7.5.0,<8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geneset_translator"]
